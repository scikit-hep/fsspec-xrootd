version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci: "
    groups:
      ci-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
    cooldown:
      default-days: 7
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "build: "
    cooldown:
      default-days: 7
